<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unterrichtsunterlagen – Digitalisierung HFW</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f5f7;color:#1f2a37;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;max-width:460px;width:100%;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.08);
        padding:34px 30px;text-align:center}
  .logo{font-weight:800;color:#C8102E;font-size:20px;letter-spacing:1px;margin-bottom:6px}
  .logo span{color:#1f2a37}
  h1{font-size:23px;margin:18px 0 10px}
  p{color:#556;font-size:15px;line-height:1.55;margin-bottom:8px}
  .file{display:flex;align-items:center;gap:12px;background:#f7f8fa;border:1px solid #e5e8ec;border-radius:12px;
        padding:14px 16px;margin:22px 0;text-align:left}
  .file .ico{font-size:28px}
  .file .meta b{display:block;font-size:15px}
  .file .meta small{color:#8a929f}
  .btn{display:block;background:#C8102E;color:#fff;text-decoration:none;font-weight:700;font-size:17px;
       padding:16px;border-radius:12px}
  .foot{margin-top:18px;color:#9aa1ad;font-size:12px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">HFW <span>· Digitalisierung</span></div>
    <h1>Unterlagen fürs Handy</h1>
    <p>Lade die Unterlagen für die heutige Lektion direkt auf dein Smartphone, damit du gleich mitmachen kannst.</p>
    <div class="file">
      <div class="ico">📄</div>
      <div class="meta"><b>Unterrichtsunterlagen.pdf</b><small>PDF · ca. 0,2 MB</small></div>
    </div>
    <a class="btn" id="dl" href="Unterrichtsunterlagen_fuers_Handy.pdf" download>Jetzt herunterladen</a>
    <div class="foot">HFW Schaffhausen · Digitalisierung</div>
  </div>
  <!-- GoatCounter: Seitenaufruf = Scan (automatisch) -->
  <script data-goatcounter="https://belibas.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <script>
    document.getElementById('dl').addEventListener('click', function(){
      if (window.goatcounter && window.goatcounter.count) {
        window.goatcounter.count({ path: 'pdf-download', title: 'PDF heruntergeladen', event: true });
      }
    });
  </script>
</body>
</html>
